name: nagar_drishti
description: "AI-Powered Civic Issue Reporting & Resolution Tracking System - Nagar-Drishti"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  appwrite: ^12.0.4

dependency_overrides:
  flutter_web_auth_2: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
